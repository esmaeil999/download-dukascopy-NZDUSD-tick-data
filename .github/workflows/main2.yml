name: Download Dukascopy Tick Data

on:
  workflow_dispatch:
    inputs:
      instrument:
        description: "Instrument (EURUSD, GBPUSD, USDJPY, XAUUSD)"
        required: true
        default: "NZDUSD"

      from:
        description: "Start date YYYY-MM-DD"
        required: true
        default: "2000-01-01"

      to:
        description: "End date YYYY-MM-DD"
        required: true
        default: "2026-09-01"

permissions:
  contents: write

jobs:

  # ============================================================
  # 1) Prepare
  # ============================================================

  prepare:
    runs-on: ubuntu-latest

    outputs:
      instrument: ${{ steps.meta.outputs.instrument }}
      instrument_upper: ${{ steps.meta.outputs.instrument_upper }}
      from_date: ${{ steps.meta.outputs.from_date }}
      to_date: ${{ steps.meta.outputs.to_date }}
      years: ${{ steps.meta.outputs.years }}

    steps:

      - name: Prepare inputs and year list
        id: meta
        shell: bash

        env:
          RAW_INSTRUMENT: ${{ inputs.instrument }}
          RAW_FROM: ${{ inputs.from }}
          RAW_TO: ${{ inputs.to }}

        run: |
          set -euo pipefail

          INSTRUMENT=$(printf '%s' "$RAW_INSTRUMENT" \
            | tr '[:lower:]' '[:upper:]' \
            | tr -d '[:space:]')

          INSTRUMENT_LOWER=$(printf '%s' "$INSTRUMENT" \
            | tr '[:upper:]' '[:lower:]')

          FROM_DATE=$(printf '%s' "$RAW_FROM" | cut -d' ' -f1)
          TO_DATE=$(printf '%s' "$RAW_TO" | cut -d' ' -f1)

          # ------------------------------------------------------
          # Validate dates
          # ------------------------------------------------------

          if ! date -d "$FROM_DATE" >/dev/null 2>&1; then
            echo "ERROR: Invalid from date: $FROM_DATE"
            exit 1
          fi

          if ! date -d "$TO_DATE" >/dev/null 2>&1; then
            echo "ERROR: Invalid to date: $TO_DATE"
            exit 1
          fi

          FROM_TS=$(date -d "$FROM_DATE" +%s)
          TO_TS=$(date -d "$TO_DATE" +%s)

          if [ "$FROM_TS" -gt "$TO_TS" ]; then
            echo "ERROR: from date is after to date"
            exit 1
          fi

          # ------------------------------------------------------
          # NEW: Clamp FROM to earliest available TICK data.
          #
          # Dukascopy tick data does NOT exist from year 2000 for
          # most instruments. Requesting those years produced empty
          # files -> missing candles in MT5.
          #
          # Verify each symbol here:
          #   https://www.dukascopy-node.app/instrument/<symbol>
          # ------------------------------------------------------

          MIN_DATE="2003-01-01"   # generic floor for tick data
          case "$INSTRUMENT" in
            NZDUSD) MIN_DATE="2003-08-03" ;;   # verified on dukascopy-node.app
            EURUSD) MIN_DATE="2003-05-04" ;;   # TODO: verify exact date
            GBPUSD) MIN_DATE="2003-05-04" ;;   # TODO: verify exact date
            USDJPY) MIN_DATE="2003-05-04" ;;   # TODO: verify exact date
            XAUUSD) MIN_DATE="2008-01-01" ;;   # TODO: verify exact date
          esac

          if [ "$FROM_TS" -lt "$(date -d "$MIN_DATE" +%s)" ]; then
            echo "::warning::No tick data before $MIN_DATE for $INSTRUMENT — clamping FROM $FROM_DATE -> $MIN_DATE"
            FROM_DATE="$MIN_DATE"
            FROM_TS=$(date -d "$FROM_DATE" +%s)
          fi

          if [ "$FROM_TS" -gt "$TO_TS" ]; then
            echo "ERROR: Nothing to download after clamping (from > to)"
            exit 1
          fi

          FROM_YEAR=$(date -d "$FROM_DATE" +%Y)
          TO_YEAR=$(date -d "$TO_DATE" +%Y)

          # ------------------------------------------------------
          # Build JSON year array
          # ------------------------------------------------------

          YEARS="["
          FIRST=1

          for ((y=FROM_YEAR; y<=TO_YEAR; y++)); do
            if [ "$FIRST" -eq 1 ]; then
              YEARS="${YEARS}\"${y}\""
              FIRST=0
            else
              YEARS="${YEARS},\"${y}\""
            fi
          done

          YEARS="${YEARS}]"

          echo "================================"
          echo "Instrument:       $INSTRUMENT"
          echo "Dukascopy symbol: $INSTRUMENT_LOWER"
          echo "Overall From:     $FROM_DATE"
          echo "Overall To:       $TO_DATE"
          echo "Years:            $YEARS"
          echo "================================"

          {
            echo "instrument=$INSTRUMENT_LOWER"
            echo "instrument_upper=$INSTRUMENT"
            echo "from_date=$FROM_DATE"
            echo "to_date=$TO_DATE"
            echo "years=$YEARS"
          } >> "$GITHUB_OUTPUT"
