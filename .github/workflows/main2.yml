name: Download Dukascopy Tick Data2

on:
  workflow_dispatch:
    inputs:
      instrument:
        description: "Instrument (EURUSD, GBPUSD, USDJPY, XAUUSD)"
        required: true
        default: "NZDUSD"
      from:
        description: "Start date YYYY-MM-DD"
        required: true
        default: "2000-01-01"
      to:
        description: "End date YYYY-MM-DD"
        required: true
        default: "2026-09-01"

permissions:
  contents: write

jobs:
  # ============================================================
  # 1) Prepare
  # ============================================================
  prepare:
    runs-on: ubuntu-latest

    outputs:
      instrument: ${{ steps.meta.outputs.instrument }}
      instrument_upper: ${{ steps.meta.outputs.instrument_upper }}
      from_date: ${{ steps.meta.outputs.from_date }}
      to_date: ${{ steps.meta.outputs.to_date }}
      years: ${{ steps.meta.outputs.years }}

    steps:
      - name: Prepare inputs and year list
        id: meta
        shell: bash
        env:
          RAW_INSTRUMENT: ${{ inputs.instrument }}
          RAW_FROM: ${{ inputs.from }}
          RAW_TO: ${{ inputs.to }}
        run: |
          set -euo pipefail

          INSTRUMENT=$(printf '%s' "$RAW_INSTRUMENT" \
            | tr '[:lower:]' '[:upper:]' \
            | tr -d '[:space:]')

          INSTRUMENT_LOWER=$(printf '%s' "$INSTRUMENT" \
            | tr '[:upper:]' '[:lower:]')

          FROM_DATE=$(printf '%s' "$RAW_FROM" | cut -d' ' -f1)
          TO_DATE=$(printf '%s' "$RAW_TO" | cut -d' ' -f1)

          # ------------------------------------------------------
          # Validate dates
          # ------------------------------------------------------
          if ! date -d "$FROM_DATE" >/dev/null 2>&1; then
            echo "ERROR: Invalid from date: $FROM_DATE"
            exit 1
          fi

          if ! date -d "$TO_DATE" >/dev/null 2>&1; then
            echo "ERROR: Invalid to date: $TO_DATE"
            exit 1
          fi

          FROM_TS=$(date -d "$FROM_DATE" +%s)
          TO_TS=$(date -d "$TO_DATE" +%s)

          if [ "$FROM_TS" -gt "$TO_TS" ]; then
            echo "ERROR: from date is after to date"
            exit 1
          fi

          # ------------------------------------------------------
          # Clamp FROM to earliest available TICK data.
          # Dukascopy tick data does NOT exist from year 2000 for
          # most instruments. Verify each symbol here:
          #   https://www.dukascopy-node.app/instrument/<symbol>
          # ------------------------------------------------------
          MIN_DATE="2003-01-01"
          case "$INSTRUMENT" in
            NZDUSD) MIN_DATE="2003-08-03" ;;
            EURUSD) MIN_DATE="2003-05-04" ;;
            GBPUSD) MIN_DATE="2003-05-04" ;;
            USDJPY) MIN_DATE="2003-05-04" ;;
            XAUUSD) MIN_DATE="2008-01-01" ;;
          esac

          MIN_TS=$(date -d "$MIN_DATE" +%s)

          if [ "$FROM_TS" -lt "$MIN_TS" ]; then
            echo "::warning::No tick data before $MIN_DATE for $INSTRUMENT - clamping FROM $FROM_DATE -> $MIN_DATE"
            FROM_DATE="$MIN_DATE"
            FROM_TS="$MIN_TS"
          fi

          if [ "$FROM_TS" -gt "$TO_TS" ]; then
            echo "ERROR: Nothing to download after clamping (from > to)"
            exit 1
          fi

          FROM_YEAR=$(date -d "$FROM_DATE" +%Y)
          TO_YEAR=$(date -d "$TO_DATE" +%Y)

          # ------------------------------------------------------
          # Build JSON year array
          # ------------------------------------------------------
          YEARS="["
          FIRST=1

          for ((y=FROM_YEAR; y<=TO_YEAR; y++)); do
            if [ "$FIRST" -eq 1 ]; then
              YEARS="${YEARS}\"${y}\""
              FIRST=0
            else
              YEARS="${YEARS},\"${y}\""
            fi
          done

          YEARS="${YEARS}]"

          echo "================================"
          echo "Instrument:       $INSTRUMENT"
          echo "Dukascopy symbol: $INSTRUMENT_LOWER"
          echo "Overall From:     $FROM_DATE"
          echo "Overall To:       $TO_DATE"
          echo "Years:            $YEARS"
          echo "================================"

          {
            echo "instrument=$INSTRUMENT_LOWER"
            echo "instrument_upper=$INSTRUMENT"
            echo "from_date=$FROM_DATE"
            echo "to_date=$TO_DATE"
            echo "years=$YEARS"
          } >> "$GITHUB_OUTPUT"

  # ============================================================
  # 2) Download one year
  # ============================================================
  download-year:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 350

    strategy:
      fail-fast: false
      matrix:
        year: ${{ fromJson(needs.prepare.outputs.years) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ==========================================================
      # Resolve dukascopy-node version (pin per run).
      # For full reproducibility replace the npm view lookup with
      # a hardcoded version, e.g. dukascopy-node@1.x.y
      # ==========================================================
      - name: Resolve dukascopy-node version
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(npm view dukascopy-node version)
          echo "dukascopy-node version: $VERSION"
          echo "pkg=dukascopy-node@${VERSION}" >> "$GITHUB_OUTPUT"

      # ==========================================================
      # Calculate year range
      # ==========================================================
      - name: Calculate year range
        id: range
        shell: bash
        env:
          OVERALL_FROM: ${{ needs.prepare.outputs.from_date }}
          OVERALL_TO: ${{ needs.prepare.outputs.to_date }}
          INSTRUMENT: ${{ needs.prepare.outputs.instrument }}
          INSTRUMENT_UPPER: ${{ needs.prepare.outputs.instrument_upper }}
          YEAR: ${{ matrix.year }}
        run: |
          set -euo pipefail

          YEAR_START="${YEAR}-01-01"
          YEAR_END=$(date -d "${YEAR}-01-01 +1 year" +%Y-%m-%d)

          # Start date
          if [ "$(date -d "$OVERALL_FROM" +%Y)" -eq "$YEAR" ]; then
            FROM_DATE="$OVERALL_FROM"
          else
            FROM_DATE="$YEAR_START"
          fi

          # End date
          if [ "$(date -d "$OVERALL_TO" +%Y)" -eq "$YEAR" ]; then
            TO_DATE="$OVERALL_TO"
          else
            TO_DATE="$YEAR_END"
          fi

          # Safety check
          if [ "$(date -d "$FROM_DATE" +%s)" -gt "$(date -d "$TO_DATE" +%s)" ]; then
            echo "ERROR: Invalid range"
            exit 1
          fi

          SLUG="${INSTRUMENT}-ticks-${FROM_DATE}-to-${TO_DATE}"

          echo "================================"
          echo "Year: $YEAR"
          echo "From: $FROM_DATE"
          echo "To:   $TO_DATE"
          echo "Slug: $SLUG"
          echo "================================"

          {
            echo "from_date=$FROM_DATE"
            echo "to_date=$TO_DATE"
            echo "slug=$SLUG"
            echo "instrument=$INSTRUMENT"
            echo "instrument_upper=$INSTRUMENT_UPPER"
          } >> "$GITHUB_OUTPUT"

      # ==========================================================
      # Download
      # ==========================================================
      - name: Download ticks
        shell: bash
        env:
          PKG: ${{ steps.pkg.outputs.pkg }}
          SYMBOL: ${{ steps.range.outputs.instrument }}
          FROM_DATE: ${{ steps.range.outputs.from_date }}
          TO_DATE: ${{ steps.range.outputs.to_date }}
        run: |
          set -euo pipefail
          mkdir -p download

          # ------------------------------------------------------
          # dukascopy-node treats -to literally and can drop the
          # last day when -to is midnight (issue #193). Request one
          # extra day so the real end date is complete. (Overlap of
          # Jan 1 between yearly chunks is harmless - bank holiday.)
          # ------------------------------------------------------
          DL_TO=$(date -d "$TO_DATE +1 day" +%F)

          echo "Downloading Dukascopy tick data..."
          echo "Range: $FROM_DATE -> $TO_DATE (requesting until $DL_TO)"
          df -h

          # ------------------------------------------------------
          # Retry options - THE main fix for missing candles.
          # Dukascopy's datafeed frequently returns EMPTY (0-byte)
          # or transient error responses for hours that DO have
          # data. Defaults are -r 0 (no retries) and -re false
          # (empty responses accepted as "no data"), which silently
          # creates holes in the CSV.
          #
          #   -r 5      retry failed downloads up to 5 times
          #   -re true  also retry successful-but-empty responses
          #   -rp 1000  wait 1s between retries
          #
          # Default fail behaviour is kept: if an hour is still
          # missing after all retries, the JOB FAILS loudly instead
          # of publishing an incomplete file.
          # ------------------------------------------------------
          npx -y "$PKG" \
            -i "$SYMBOL" \
            -from "$FROM_DATE" \
            -to "$DL_TO" \
            -t tick \
            -f csv \
            -dir "./download" \
            -r 5 -re true -rp 1000

          df -h

      # ==========================================================
      # Find CSV
      # ==========================================================
      - name: Find downloaded CSV
        shell: bash
        env:
          SYMBOL: ${{ steps.range.outputs.instrument }}
          SLUG: ${{ steps.range.outputs.slug }}
        run: |
          set -euo pipefail

          echo "Downloaded files:"
          find download -type f -print || true

          CSV_FILE=$(find download -type f -name "*.csv" | head -n 1)

          if [ -z "$CSV_FILE" ]; then
            echo "ERROR: No CSV file found."
            exit 1
          fi

          echo "CSV: $CSV_FILE"

          # ------------------------------------------------------
          # Sanity check - an (almost) empty CSV means the source
          # had no data for this range at all.
          # ------------------------------------------------------
          ROWS=$(wc -l < "$CSV_FILE")
          echo "Rows in raw CSV: $ROWS"

          if [ "$ROWS" -lt 2 ]; then
            echo "ERROR: CSV is empty - no tick data for this range."
            echo "Check data availability:"
            echo "  https://www.dukascopy-node.app/instrument/$SYMBOL"
            exit 1
          fi

          cp "$CSV_FILE" "${SLUG}.csv"
          ls -lh "${SLUG}.csv"

      # ==========================================================
      # Gap check - detect silent download holes BEFORE publishing.
      # Streams the file (low memory), flags gaps longer than 12h
      # that do NOT span a weekend.
      # ==========================================================
      - name: Check for data gaps
        shell: bash
        env:
          SLUG: ${{ steps.range.outputs.slug }}
        run: |
          set -euo pipefail
          CSV_FILE="${SLUG}.csv"

          python3 - "$CSV_FILE" <<'PYEOF'
          import csv, sys
          from datetime import datetime, timedelta, timezone

          path = sys.argv[1]
          GAP_MIN = timedelta(hours=12)   # shorter gaps are normal (illiquid hours)
          HARD_GAP = timedelta(days=5)    # any gap longer than this = real hole
          MAX_GAPS = 10                   # more suspicious gaps than this = fail

          def parse(v):
              v = v.strip()
              try:
                  # dukascopy-node default: epoch milliseconds (UTC)
                  return datetime.fromtimestamp(int(v) / 1000, tz=timezone.utc)
              except ValueError:
                  # fallback: ISO 8601 (if --date-format is ever used)
                  return datetime.fromisoformat(v.replace("Z", "+00:00"))

          def spans_weekend(a, b):
              d = a.date()
              while d <= b.date():
                  if d.weekday() >= 5:
                      return True
                  d += timedelta(days=1)
              return False

          prev = None
          first = last = None
          rows = 0
          gaps = []

          with open(path, newline="") as f:
              r = csv.reader(f)
              next(r, None)  # skip header
              for row in r:
                  if not row:
                      continue
                  try:
                      t = parse(row[0])
                  except Exception:
                      continue
                  rows += 1
                  if first is None:
                      first = t
                  last = t
                  if prev is not None and t - prev > GAP_MIN and not spans_weekend(prev, t):
                      gaps.append((prev, t))
                  prev = t

          print(f"rows: {rows}")
          print(f"range: {first} -> {last}")
          print(f"suspicious gaps (>12h, no weekend): {len(gaps)}")

          for a, b in gaps[:30]:
              print(f"::warning::GAP {a.isoformat()} -> {b.isoformat()}")

          hard = [g for g in gaps if g[1] - g[0] > HARD_GAP]
          if hard:
              print(f"ERROR: {len(hard)} gap(s) longer than {HARD_GAP.days} days - data is incomplete.")
              sys.exit(1)

          if len(gaps) > MAX_GAPS:
              print("ERROR: too many suspicious gaps - likely silent download failures.")
              sys.exit(1)

          print("Gap check OK (single mid-week gaps can be bank holidays - review warnings above).")
          PYEOF

      # ==========================================================
      # Convert
      # ==========================================================
      - name: Convert CSV to JForex format
        shell: bash
        env:
          SLUG: ${{ steps.range.outputs.slug }}
        run: |
          set -euo pipefail
          INPUT_FILE="${SLUG}.csv"

          if [ ! -f "$INPUT_FILE" ]; then
            echo "ERROR: CSV file not found."
            exit 1
          fi

          # ------------------------------------------------------
          # Row-count guard around the converter so it cannot
          # silently drop data rows.
          # ------------------------------------------------------
          BEFORE=$(wc -l < "$INPUT_FILE")
          python convert.py "$INPUT_FILE"
          AFTER=$(wc -l < "$INPUT_FILE")

          echo "Rows before convert: $BEFORE"
          echo "Rows after convert:  $AFTER"

          if [ "$AFTER" -lt 2 ]; then
            echo "ERROR: converted CSV is empty."
            exit 1
          fi

          DIFF=$(( BEFORE > AFTER ? BEFORE - AFTER : AFTER - BEFORE ))
          if [ "$DIFF" -gt 2 ]; then
            echo "::warning::convert.py changed row count by $DIFF ($BEFORE -> $AFTER). Verify this is intentional."
          fi

      # ==========================================================
      # ZIP
      # ==========================================================
      - name: Zip CSV
        shell: bash
        env:
          SLUG: ${{ steps.range.outputs.slug }}
        run: |
          set -euo pipefail
          CSV_FILE="${SLUG}.csv"
          ZIP_FILE="${SLUG}.zip"

          if [ ! -f "$CSV_FILE" ]; then
            echo "ERROR: CSV file not found."
            exit 1
          fi

          zip -9 -j "$ZIP_FILE" "$CSV_FILE"
          ls -lh "$ZIP_FILE"

      # ==========================================================
      # Split if larger than 1.9GB
      # ==========================================================
      - name: Split ZIP if larger than 1.9GB
        shell: bash
        env:
          SLUG: ${{ steps.range.outputs.slug }}
        run: |
          set -euo pipefail
          FILE="${SLUG}.zip"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: ZIP file not found."
            exit 1
          fi

          SIZE=$(stat -c%s "$FILE")
          LIMIT=$((1900 * 1024 * 1024))

          echo "ZIP size: $SIZE bytes"
          echo "Limit:    $LIMIT bytes"

          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "ZIP is larger than 1.9GB."
            echo "Splitting..."
            split -b 1900M "$FILE" "${FILE}."
            rm "$FILE"
            echo "Created parts:"
            ls -lh "${FILE}".*
          else
            echo "ZIP is smaller than 1.9GB."
          fi

      # ==========================================================
      # GitHub Release
      # ==========================================================
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.range.outputs.slug }}
          name: "${{ steps.range.outputs.instrument_upper }} ticks ${{ steps.range.outputs.from_date }} to ${{ steps.range.outputs.to_date }}"
          generate_release_notes: false
          files: |
            ./${{ steps.range.outputs.slug }}.zip
            ./${{ steps.range.outputs.slug }}.zip.*

  # ============================================================
  # 3) Send releases to Telegram
  # ============================================================
  send-to-telegram:
    needs:
      - prepare
      - download-year
    runs-on: ubuntu-latest

    steps:
      - name: Send releases to Telegram in chronological order
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OVERALL_FROM: ${{ needs.prepare.outputs.from_date }}
          OVERALL_TO: ${{ needs.prepare.outputs.to_date }}
          INSTRUMENT: ${{ needs.prepare.outputs.instrument }}
          INSTRUMENT_UPPER: ${{ needs.prepare.outputs.instrument_upper }}
        run: |
          set -euo pipefail

          # ======================================================
          # Check Telegram settings
          # ======================================================
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
            echo "ERROR: TELEGRAM_BOT_TOKEN is missing."
            exit 1
          fi

          if [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "ERROR: TELEGRAM_CHAT_ID is missing."
            exit 1
          fi

          # ======================================================
          # Calculate years
          # ======================================================
          FROM_YEAR=$(date -d "$OVERALL_FROM" +%Y)
          TO_YEAR=$(date -d "$OVERALL_TO" +%Y)

          echo "=========================================="
          echo "Starting Telegram sending"
          echo "Instrument: $INSTRUMENT_UPPER"
          echo "From year:  $FROM_YEAR"
          echo "To year:    $TO_YEAR"
          echo "=========================================="

          # ======================================================
          # Send one year at a time
          # ======================================================
          for ((YEAR=FROM_YEAR; YEAR<=TO_YEAR; YEAR++)); do
            echo ""
            echo "=========================================="
            echo "Processing year: $YEAR"
            echo "=========================================="

            YEAR_START="${YEAR}-01-01"
            YEAR_END=$(date -d "${YEAR}-01-01 +1 year" +%Y-%m-%d)

            if [ "$YEAR" -eq "$FROM_YEAR" ]; then
              FROM_DATE="$OVERALL_FROM"
            else
              FROM_DATE="$YEAR_START"
            fi

            if [ "$YEAR" -eq "$TO_YEAR" ]; then
              TO_DATE="$OVERALL_TO"
            else
              TO_DATE="$YEAR_END"
            fi

            TAG="${INSTRUMENT}-ticks-${FROM_DATE}-to-${TO_DATE}"
            ASSET_NAME="${TAG}.zip"

            echo "From: $FROM_DATE"
            echo "To:   $TO_DATE"
            echo "Tag:  $TAG"

            # ====================================================
            # Check Release
            # ====================================================
            if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "ERROR: Release not found: $TAG"
              exit 1
            fi

            RELEASE_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")

            # ====================================================
            # Find normal ZIP
            # ====================================================
            ASSET_URL=$(echo "$RELEASE_JSON" | python3 -c '
          import sys, json
          data = json.load(sys.stdin)
          target = sys.argv[1]
          for asset in data.get("assets", []):
              if asset.get("name") == target:
                  print(asset.get("browser_download_url", ""))
                  break
          ' "$ASSET_NAME")

            DOWNLOAD_TEXT="⬇️ DOWNLOAD"

            # ====================================================
            # If ZIP was split
            # ====================================================
            if [ -z "$ASSET_URL" ]; then
              echo "Original ZIP not found."
              echo "Checking split parts..."

              FIRST_PART=$(echo "$RELEASE_JSON" | python3 -c '
          import sys, json
          data = json.load(sys.stdin)
          target = sys.argv[1]
          parts = []
          for asset in data.get("assets", []):
              name = asset.get("name", "")
              if name.startswith(target + "."):
                  parts.append(asset)
          parts.sort(key=lambda x: x.get("name", ""))
          if parts:
              print(parts[0].get("browser_download_url", ""))
          ' "$ASSET_NAME")

              if [ -z "$FIRST_PART" ]; then
                echo "ERROR: No ZIP or split parts found."
                exit 1
              fi

              ASSET_URL="$FIRST_PART"
              DOWNLOAD_TEXT="⬇️ DOWNLOAD PART 1"
            fi

            # ====================================================
            # Get asset size
            # ====================================================
            ASSET_SIZE=$(echo "$RELEASE_JSON" | python3 -c '
          import sys, json
          data = json.load(sys.stdin)
          target = sys.argv[1]
          for asset in data.get("assets", []):
              if asset.get("name") == target:
                  print(asset.get("size", 0))
                  break
          ' "$ASSET_NAME")

            if [ -z "$ASSET_SIZE" ]; then
              ASSET_SIZE=0
            fi

            FILE_SIZE_MB=$(awk -v s="$ASSET_SIZE" 'BEGIN {printf "%.2f", s / 1024 / 1024}')

            # ====================================================
            # Telegram caption
            # ====================================================
            CAPTION=$(printf '<b>📦 %s Tick Data</b>\n━━━━━━━━━━━━━━━━\n📅 %s → %s\n💾 Size: %s MB' \
              "$INSTRUMENT_UPPER" \
              "$FROM_DATE" \
              "$TO_DATE" \
              "$FILE_SIZE_MB")

            # ====================================================
            # Telegram inline keyboard
            # ====================================================
            KEYBOARD=$(python3 -c '
          import json, sys
          text = sys.argv[1]
          url = sys.argv[2]
          data = {"inline_keyboard": [[{"text": text, "url": url}]]}
          print(json.dumps(data, ensure_ascii=False))
          ' "$DOWNLOAD_TEXT" "$ASSET_URL")

            # ====================================================
            # Send Telegram message
            # ====================================================
            echo ""
            echo "Sending $YEAR to Telegram..."

            RESPONSE=$(curl -fsS \
              --retry 3 \
              --retry-delay 3 \
              --retry-all-errors \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${CAPTION}" \
              --data-urlencode "parse_mode=HTML" \
              --data-urlencode "reply_markup=${KEYBOARD}")

            echo "$RESPONSE"

            if ! echo "$RESPONSE" | grep -q '"ok":true'; then
              echo "ERROR: Telegram failed for year $YEAR."
              exit 1
            fi

            echo "SUCCESS: $YEAR sent to Telegram."
            sleep 2
          done

          echo ""
          echo "=========================================="
          echo "ALL YEARS SENT SUCCESSFULLY"
          echo "=========================================="
